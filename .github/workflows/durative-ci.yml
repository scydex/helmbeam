# .github/workflows/durative-ci.yml on a test branch of scydex/helmbeam (public): the first real GitHub run.
# Three jobs: the runner's own toolset, a container job, and a service container, each on `runs-on: durative`.
name: Durative CI
on:
  push:
    branches: [durative-ci-test]
  workflow_dispatch:
jobs:
  host:
    runs-on: durative
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --version && npm --version && docker version --format '{{.Server.Version}}'
  container:
    runs-on: durative
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: node -e "console.log(process.version)"
  service:
    runs-on: durative
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null && PGPASSWORD=postgres psql -h localhost -U postgres -c 'select 1'
